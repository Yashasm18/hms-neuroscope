services:
  - type: web
    name: hms-neuroscope
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.maxUploadSize 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PUBLIC_DEMO
        value: "1"
