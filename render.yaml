services:
  - type: web
    name: harmful-brain-activity
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_app.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PUBLIC_DEMO
        value: "1"
